<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Watch Games</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .watch-screen {
    width: 100vmin; height: 100vmin;
    border-radius: 50%;
    background: #000;
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 12%;
    text-align: center;
  }
  .hidden { display: none !important; }
  h1 { font-size: 5.5vmin; margin: 0 0 4vmin 0; color: #00e676; letter-spacing: 0.5px; }
  .btn {
    width: 85%; padding: 4vmin 2vmin; margin: 2vmin 0;
    border: none; border-radius: 999px;
    font-size: 4.8vmin; font-weight: bold;
    background: #1e1e1e; color: #fff;
    border: 2px solid #333; cursor: pointer;
  }
  .btn:active { background: #00e676; color: #000; border-color: #00e676; }
  .back-btn {
    position: absolute; bottom: 4.5%;
    padding: 1.8vmin 5vmin; font-size: 3.8vmin;
    background: #1a1a1a; color: #aaa; border: 1px solid #333;
    border-radius: 999px; cursor: pointer;
  }

  /* ТИР */
  #target-area {
    width: 56vmin; height: 56vmin;
    border-radius: 50%;
    background: #111;
    border: 3px solid #333;
    display: flex; align-items: center; justify-content: center;
    position: relative; cursor: pointer;
    transition: background 0.1s;
  }
  .ring {
    border-radius: 50%; position: absolute;
    display: flex; align-items: center; justify-content: center;
  }
  .r1 { width: 100%; height: 100%; border: 2px solid #444; }
  .r2 { width: 70%; height: 70%; border: 2px solid #666; }
  .r3 { width: 40%; height: 40%; border: 2px solid #888; }
  .r4 { width: 15%; height: 15%; background: #ff1744; }
  #shoot-status { font-size: 4.5vmin; margin-bottom: 2.5vmin; font-weight: bold; min-height: 6vmin; }
  #shoot-best { font-size: 3.5vmin; color: #888; margin-top: 2vmin; }

  /* ШАХМАТЫ 5x5 */
  #chess-status { font-size: 4vmin; margin-bottom: 1.5vmin; color: #00e676; font-weight: bold; }
  #board {
    display: grid; grid-template-columns: repeat(5, 1fr);
    width: 56vmin; height: 56vmin;
    border: 2px solid #444; border-radius: 8px; overflow: hidden;
  }
  .cell {
    display: flex; align-items: center; justify-content: center;
    font-size: 7.5vmin; cursor: pointer;
  }
  .light { background: #2c2c2c; }
  .dark { background: #161616; }
  .selected { background: #00e676 !important; color: #000 !important; }
  .valid-move { box-shadow: inset 0 0 0 3px #00e676; }
  .w-piece { color: #ffffff; text-shadow: 0 1px 3px #000; }
  .b-piece { color: #ff5252; text-shadow: 0 1px 3px #000; }
</style>
</head>
<body>

<div class="watch-screen">
  <!-- ГЛАВНОЕ МЕНЮ -->
  <div id="menu-screen" style="width:100%; display:flex; flex-direction:column; align-items:center;">
    <h1>WATCH ARENA</h1>
    <button class="btn" onclick="openGame('shoot')">🎯 Тир: Реакция</button>
    <button class="btn" onclick="openGame('chess')">♟️ Шахматы 5×5</button>
  </div>

  <!-- ИГРА 1: ТИР -->
  <div id="shoot-screen" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center;">
    <div id="shoot-status">Тапни по мишени для старта</div>
    <div id="target-area" onpointerdown="handleShot()">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="ring r4" id="bullseye"></div>
    </div>
    <div id="shoot-best">Рекорд: —</div>
    <button class="back-btn" onclick="goMenu()">Меню</button>
  </div>

  <!-- ИГРА 2: ШАХМАТЫ -->
  <div id="chess-screen" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center;">
    <div id="chess-status">Твой ход (Белые)</div>
    <div id="board"></div>
    <button class="back-btn" onclick="goMenu()">Меню</button>
  </div>
</div>

<script>
// Регистрация офлайн-кэша
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

function vibro(ms) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

function openGame(name) {
  vibro(30);
  document.getElementById('menu-screen').classList.add('hidden');
  document.getElementById('shoot-screen').classList.add('hidden');
  document.getElementById('chess-screen').classList.add('hidden');
  if (name === 'shoot') {
    document.getElementById('shoot-screen').classList.remove('hidden');
    resetShoot();
  } else {
    document.getElementById('chess-screen').classList.remove('hidden');
    initChess();
  }
}

function goMenu() {
  vibro(20);
  clearTimeout(shootTimer);
  document.getElementById('shoot-screen').classList.add('hidden');
  document.getElementById('chess-screen').classList.add('hidden');
  document.getElementById('menu-screen').classList.remove('hidden');
}

/* ==================== ЛОГИКА ТИРА ==================== */
let shootState = 'idle'; // idle, waiting, ready
let shootTimer = null;
let startTime = 0;
let bestReaction = localStorage.getItem('best_react') || null;

function resetShoot() {
  clearTimeout(shootTimer);
  shootState = 'idle';
  document.getElementById('target-area').style.background = '#111';
  document.getElementById('shoot-status').style.color = '#fff';
  document.getElementById('shoot-status').innerText = 'Тапни для старта';
  if (bestReaction) {
    document.getElementById('shoot-best').innerText = `Рекорд: ${bestReaction} мс`;
  }
}

function handleShot() {
  const area = document.getElementById('target-area');
  const status = document.getElementById('shoot-status');

  if (shootState === 'idle') {
    vibro(20);
    shootState = 'waiting';
    area.style.background = '#2a0808';
    status.style.color = '#ff5252';
    status.innerText = 'ЖДИ СИГНАЛА...';
    const delay = 1200 + Math.random() * 2500;
    shootTimer = setTimeout(() => {
      shootState = 'ready';
      startTime = performance.now();
      area.style.background = '#004d25';
      status.style.color = '#00e676';
      status.innerText = 'ОГОНЬ!';
      vibro(40);
    }, delay);
  } else if (shootState === 'waiting') {
    clearTimeout(shootTimer);
    vibro([60, 40, 60]);
    shootState = 'idle';
    area.style.background = '#111';
    status.style.color = '#ffab00';
    status.innerText = 'ФАЛЬСТАРТ! Ещё раз';
  } else if (shootState === 'ready') {
    const diff = Math.round(performance.now() - startTime);
    vibro(50);
    shootState = 'idle';
    area.style.background = '#111';
    status.style.color = '#00e676';
    status.innerText = `${diff} мс — Попадание!`;
    if (!bestReaction || diff < bestReaction) {
      bestReaction = diff;
      localStorage.setItem('best_react', diff);
      document.getElementById('shoot-best').innerText = `Рекорд: ${bestReaction} мс`;
    }
  }
}

/* ==================== ЛОГИКА ШАХМАТ 5x5 ==================== */
// Gardner Chess: 5x5 (k q b n r / p p p p p)
const ICONS = {
  'K':'♔','Q':'♕','R':'♖','B':'♗','N':'♘','P':'♙',
  'k':'♚','q':'♛','r':'♜','b':'♝','n':'♞','p':'♟'
};
const VALS = { p:10, n:30, b:30, r:50, q:90, k:900 };
let board = [];
let selected = null;
let validMoves = [];
let turn = 'w';
let gameOver = false;

function initChess() {
  board = [
    ['r','n','b','q','k'],
    ['p','p','p','p','p'],
    ['','','','',''],
    ['P','P','P','P','P'],
    ['R','N','B','Q','K']
  ];
  selected = null;
  validMoves = [];
  turn = 'w';
  gameOver = false;
  document.getElementById('chess-status').innerText = 'Твой ход (Белые)';
  renderBoard();
}

function isWhite(p) { return p && p === p.toUpperCase(); }
function isBlack(p) { return p && p === p.toLowerCase(); }

function renderBoard() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
      if (selected && selected.r === r && selected.c === c) cell.classList.add('selected');
      if (validMoves.some(m => m.r === r && m.c === c)) cell.classList.add('valid-move');
      const p = board[r][c];
      if (p) {
        cell.innerText = ICONS[p];
        cell.classList.add(isWhite(p) ? 'w-piece' : 'b-piece');
      }
      cell.onclick = () => onCellClick(r, c);
      el.appendChild(cell);
    }
  }
}

function onCellClick(r, c) {
  if (gameOver || turn !== 'w') return;
  const move = validMoves.find(m => m.r === r && m.c === c);
  if (move && selected) {
    makeMove(selected.r, selected.c, r, c);
    selected = null;
    validMoves = [];
    renderBoard();
    if (!gameOver) {
      turn = 'b';
      document.getElementById('chess-status').innerText = 'Бот думает...';
      setTimeout(botMove, 350);
    }
    return;
  }
  const p = board[r][c];
  if (isWhite(p)) {
    vibro(15);
    selected = { r, c };
    validMoves = getMoves(r, c, board);
    renderBoard();
  }
}

function makeMove(r1, c1, r2, c2) {
  vibro(30);
  const piece = board[r1][c1];
  const target = board[r2][c2];
  board[r2][c2] = piece;
  board[r1][c1] = '';
  // Превращение пешки в ферзя
  if (piece === 'P' && r2 === 0) board[r2][c2] = 'Q';
  if (piece === 'p' && r2 === 4) board[r2][c2] = 'q';

  if (target === 'k') {
    gameOver = true;
    document.getElementById('chess-status').innerText = 'Победа! Король взят';
  } else if (target === 'K') {
    gameOver = true;
    document.getElementById('chess-status').innerText = 'Поражение!';
  }
}

function getMoves(r, c, b) {
  const p = b[r][c];
  if (!p) return [];
  const w = isWhite(p);
  const moves = [];
  const add = (nr, nc) => {
    if (nr < 0 || nr >= 5 || nc < 0 || nc >= 5) return false;
    const t = b[nr][nc];
    if (!t) { moves.push({ r: nr, c: nc }); return true; }
    if (w !== isWhite(t)) { moves.push({ r: nr, c: nc }); }
    return false;
  };
  const type = p.toLowerCase();
  if (type === 'p') {
    const dir = w ? -1 : 1;
    if (r + dir >= 0 && r + dir < 5 && !b[r + dir][c]) moves.push({ r: r + dir, c });
    [-1, 1].forEach(dc => {
      const nr = r + dir, nc = c + dc;
      if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5 && b[nr][nc] && w !== isWhite(b[nr][nc])) {
        moves.push({ r: nr, c: nc });
      }
    });
  } else if (type === 'n') {
    [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]].forEach(([dr, dc]) => add(r+dr, c+dc));
  } else if (type === 'k') {
    for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) if (dr||dc) add(r+dr, c+dc);
  } else {
    const dirs = [];
    if (type === 'r' || type === 'q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
    if (type === 'b' || type === 'q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
    dirs.forEach(([dr, dc]) => {
      let nr = r + dr, nc = c + dc;
      while (add(nr, nc)) { nr += dr; nc += dc; }
    });
  }
  return moves;
}

function botMove() {
  if (gameOver) return;
  let allMoves = [];
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      if (isBlack(board[r][c])) {
        getMoves(r, c, board).forEach(m => {
          let score = Math.random() * 2;
          const target = board[m.r][m.c];
          if (target) score += VALS[target.toLowerCase()] * 10;
          if (m.r === 2 && m.c === 2) score += 3; // контроль центра
          allMoves.push({ r1: r, c1: c, r2: m.r, c2: m.c, score });
        });
      }
    }
  }
  if (allMoves.length === 0) {
    gameOver = true;
    document.getElementById('chess-status').innerText = 'Ничья (Пат)!';
    return;
  }
  allMoves.sort((a, b) => b.score - a.score);
  const best = allMoves[0];
  makeMove(best.r1, best.c1, best.r2, best.c2);
  renderBoard();
  if (!gameOver) {
    turn = 'w';
    document.getElementById('chess-status').innerText = 'Твой ход (Белые)';
  }
}
</script>
</body>
</html>
